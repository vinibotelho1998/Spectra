name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Rodar o smoke test dos efeitos
        run: python tools/smoke.py

      - name: Congelar o app (PyInstaller)
        run: pyinstaller dbx-prism.spec --noconfirm

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Definir a versao do build
        id: ver
        shell: pwsh
        run: |
          $version = "1.0.$($env:GITHUB_RUN_NUMBER)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compilar o instalador
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction Stop |
            Select-Object -First 1 -ExpandProperty FullName
          & $iscc installer\dbx-prism.iss "/DMyAppVersion=${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: DBXPrism-Setup-${{ steps.ver.outputs.version }}
          path: installer/output/*.exe

      - name: Publicar a release "latest"
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest installer\output\*.exe `
            --title "DBX Prism ${{ steps.ver.outputs.version }}" `
            --notes "Build automatico do topo da main (commit ${{ github.sha }})." `
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
