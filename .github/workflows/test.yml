name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar testes sem hardware
        run: python -m pytest
      - name: Rodar regressões da interface
        run: node --test tests/test_frontend.js

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar testes sem hardware
        run: python -m pytest
      - name: Rodar regressões da interface
        run: node --test tests/test_frontend.js
