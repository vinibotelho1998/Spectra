name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Rodar a suite de testes
        run: python -m pytest

      - name: Incrementar versao
        id: ver
        shell: pwsh
        # Depois dos testes e antes de congelar: o app mostra spectra.__version__ no
        # topo, entao o numero tem que estar no codigo e nao so no instalador.
        run: |
          $conteudo = Get-Content -Path "spectra/__init__.py" -Raw
          $m = [regex]::Match($conteudo, '__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"')
          if (-not $m.Success) { throw "Nao achei __version__ no formato X.Y.Z" }
          $nova = "$($m.Groups[1].Value).$($m.Groups[2].Value).$([int]$m.Groups[3].Value + 1)"

          $conteudo = $conteudo -replace '__version__\s*=\s*"\d+\.\d+\.\d+"', "__version__ = `"$nova`""
          Set-Content -Path "spectra/__init__.py" -Value $conteudo -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spectra/__init__.py
          git commit -m "chore: incrementa versao para $nova [skip ci]"
          git push origin HEAD:main

          "version=$nova" >> $env:GITHUB_OUTPUT

      - name: Congelar o app (PyInstaller)
        run: pyinstaller spectra.spec --noconfirm

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar o instalador
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction Stop |
            Select-Object -First 1 -ExpandProperty FullName
          & $iscc installer\spectra.iss "/DMyAppVersion=${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Spectra-Setup-${{ steps.ver.outputs.version }}
          path: installer/output/*.exe

      - name: Publicar a release "latest"
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest installer\output\*.exe `
            --title "Spectra ${{ steps.ver.outputs.version }}" `
            --notes "Build automatico do topo da main (commit ${{ github.sha }})." `
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
